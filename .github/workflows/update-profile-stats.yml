name: Update profile statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate GitHub activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          core_version: 2.3.1
          options: username=zerootem&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&custom_title=GitHub+Activity&bg_color=0B1220&title_color=E6EDF7&text_color=9EB0C9&icon_color=42D6B2
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          core_version: 2.3.1
          options: username=zerootem&layout=compact&langs_count=6&hide_border=true&bg_color=0B1220&title_color=E6EDF7&text_color=9EB0C9&icon_color=42D6B2
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile statistics"
            git push
          fi
